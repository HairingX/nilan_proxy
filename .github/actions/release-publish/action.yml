name: 'Publish release'
description: 'Bump __version__, tag, build distributions, capture draft notes, and publish a GitHub Release.'

inputs:
  version:
    description: 'Version to release (X.Y.Z or X.Y.Z-suffix, no v prefix)'
    required: true
  github-token:
    description: 'Token with contents:write to push commits/tags and manage releases'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Validate version input
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$ ]]; then
          echo "::error::Version must match X.Y.Z or X.Y.Z-suffix (got: $VERSION)"
          exit 1
        fi

    - name: Check out main
      uses: actions/checkout@v6
      with:
        ref: main
        fetch-depth: 0
        token: ${{ inputs.github-token }}

    - name: Verify tag does not already exist
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if git rev-parse "v$VERSION" >/dev/null 2>&1; then
          echo "::error::Tag v$VERSION already exists. Pick a new version."
          exit 1
        fi

    - name: Verify the version is not already on PyPI
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        # PyPI refuses to overwrite a version, so fail here rather than after tagging.
        status=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/nilan_proxy/$VERSION/json")
        if [[ "$status" == "200" ]]; then
          echo "::error::nilan_proxy $VERSION is already on PyPI. Pick a new version."
          exit 1
        fi

    - name: Bump __version__
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        python3 ${{ github.workspace }}/.github/scripts/update__version__.py --version "$VERSION" --file /src/nilan_proxy/__init__.py

    - name: Commit version bump and create tag
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add ./src/nilan_proxy/__init__.py
        if git diff --cached --quiet; then
          echo "__version__ already at $VERSION — tagging current HEAD"
        else
          git commit -m "Updated version to v$VERSION"
          git push origin HEAD:main
        fi
        git tag "v$VERSION"
        git push origin "v$VERSION"

    - name: Build distributions
      shell: bash
      run: |
        python3 -m pip install --upgrade build
        python3 -m build

    - name: Verify the built version matches
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        # The tag is the source of truth, so prove the artefact agrees with it.
        if ! ls dist/nilan_proxy-"$VERSION"-*.whl >/dev/null 2>&1; then
          echo "::error::No wheel built for $VERSION. dist/ holds:"
          ls -1 dist/
          exit 1
        fi

    - name: Capture draft release notes and delete draft
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
      run: |
        draft_id=$(gh api "repos/$REPO/releases" --jq '[.[] | select(.draft==true)] | sort_by(.created_at) | reverse | .[0].id // empty')
        if [[ -n "$draft_id" ]]; then
          echo "Found existing draft release id=$draft_id"
          gh api "repos/$REPO/releases/$draft_id" --jq '.body' > /tmp/release-body.md
          gh api -X DELETE "repos/$REPO/releases/$draft_id"
          echo "Captured body and deleted draft $draft_id"
        else
          echo "No draft release found — release will be published with empty body"
          echo "" > /tmp/release-body.md
        fi

    - name: Publish GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VERSION: ${{ inputs.version }}
      run: |
        gh release create "v$VERSION" \
          --target main \
          --title "v$VERSION" \
          --notes-file /tmp/release-body.md \
          ./dist/*
