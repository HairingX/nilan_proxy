name: Release manual

# Same as Release, but with the version supplied by hand. Use it to jump a minor or
# major without relabelling merged pull requests. Note that PyPI publishing is bound
# to release.yml, so a release cut here reaches GitHub but not PyPI.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (X.Y.Z, no v prefix)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish with supplied version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository (so the local composite action is on disk)
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Publish release
        uses: ./.github/actions/release-publish
        with:
          version: ${{ inputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
