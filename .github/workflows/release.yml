name: Release

# Run this from the Actions tab. Do not publish the draft release by hand, that is
# what put the tag on a commit still holding the previous version number.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-build:
    name: Resolve version from draft, tag and build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve version from latest draft release
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          tag_name=$(gh api "repos/$REPO/releases" \
            --jq '[.[] | select(.draft==true)] | sort_by(.created_at) | reverse | .[0].tag_name // empty')
          if [[ -z "$tag_name" ]]; then
            echo "::error::No draft release found. Wait for the Release Drafter workflow to create a draft, then retry."
            exit 1
          fi
          if [[ ! "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$ ]]; then
            echo "::error::Draft tag_name has unexpected format: $tag_name (expected vX.Y.Z or vX.Y.Z-suffix)"
            exit 1
          fi
          version="${tag_name#v}"
          echo "Resolved version from draft: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out repository (so the local composite action is on disk)
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Publish release
        uses: ./.github/actions/release-publish
        with:
          version: ${{ steps.resolve.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    name: Publish release to PyPI
    runs-on: ubuntu-latest
    needs:
      - release-build

    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # PyPI trusted publishing is bound to this repository, this workflow filename
    # and this environment name. Renaming any of them breaks the upload.
    environment:
      name: pypi

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v7
        with:
          name: release-dists
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
