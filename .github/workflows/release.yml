name: Release

# Run this from the Actions tab. Do not publish the draft release by hand, that is
# what put the tag on a commit still holding the previous version number.
#
# There is deliberately only one release workflow. PyPI trusted publishing verifies
# the workflow filename, so a release cut from any other file would tag and publish
# on GitHub but never reach PyPI.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (X.Y.Z, no v prefix). Leave empty to use the version from the newest draft release.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-build:
    name: Resolve version, tag and build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            echo "Using the supplied version: $INPUT_VERSION"
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag_name=$(gh api "repos/$REPO/releases" \
            --jq '[.[] | select(.draft==true)] | sort_by(.created_at) | reverse | .[0].tag_name // empty')
          if [[ -z "$tag_name" ]]; then
            echo "::error::No draft release found. Wait for the Release Drafter workflow to create a draft, or supply a version."
            exit 1
          fi
          if [[ ! "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$ ]]; then
            echo "::error::Draft tag_name has unexpected format: $tag_name (expected vX.Y.Z or vX.Y.Z-suffix)"
            exit 1
          fi
          version="${tag_name#v}"
          echo "Resolved version from draft: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out repository (so the local composite action is on disk)
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Publish release
        uses: ./.github/actions/release-publish
        with:
          version: ${{ steps.resolve.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    name: Publish release to PyPI
    runs-on: ubuntu-latest
    needs:
      - release-build

    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # PyPI trusted publishing verifies this repository and this workflow filename.
    # Renaming release.yml breaks the upload. The environment is not verified until
    # it is constrained in the publisher configuration on PyPI.
    environment:
      name: pypi

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v7
        with:
          name: release-dists
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
